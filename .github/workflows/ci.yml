name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Placeholder keys: settings.py refuses to start without non-empty keys,
    # but the scripted tests never call a real API, so any value works.
    # Real keys never go into CI. Tracing is off so no trace is attempted.
    env:
      MISTRAL_API_KEY: ci-placeholder
      TAVILY_API_KEY: ci-placeholder
      LANGSMITH_API_KEY: ci-placeholder
      LANGSMITH_TRACING: "false"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # --frozen installs exactly what uv.lock says and fails if pyproject.toml
      # and uv.lock disagree. Python 3.12 comes from .python-version.
      - name: Install Python and locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Scripted tests (no network)
        run: uv run pytest -m "not live"