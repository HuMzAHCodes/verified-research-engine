[project]
name = "verified-research-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.10",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.15",
    "langsmith>=0.14.9",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
