[project]
name = "verified-research-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "langchain-core>=1.6.10",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.15",
    "langsmith>=0.14.9",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
# E, F: errors and undefined names. I: import order. B: likely bugs.
# UP: modern Python syntax for 3.12.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# Run from the project root so `from settings import settings` and
# `from graph...` work in tests without installing the project as a package.
pythonpath = ["."]
testpaths = ["tests"]
# Async nodes are tested with plain `async def test_...` functions.
asyncio_mode = "auto"
# Tests that call real APIs are marked live and skipped in CI.
markers = ["live: calls a real external API; run locally only"]
addopts = "--strict-markers"
